databaseChangeLog:
  - changeSet:
      id: lab-3-1-categories
      author: ykmshhh
      changes:
        - createSequence:
            sequenceName: category_id_seq
            incrementBy: 50
            startValue: 1

        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categories
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1000)

        - addUniqueConstraint:
            tableName: categories
            columnNames: name
            constraintName: uq_categories_name
