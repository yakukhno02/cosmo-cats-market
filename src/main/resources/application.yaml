spring:
  application:
    name: cosmo-cats-market

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/galactic_cats}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC

  liquibase:
    change-log: classpath:liquibase/changelog.yaml
    enabled: true

springdoc:
  swagger-ui:
    url: /api-specs/product-api-spec.yml
